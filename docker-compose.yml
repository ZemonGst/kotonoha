services:
  kotonoha_db:
    image: postgres:15
    restart: unless-stopped
    container_name: kotonoha_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev

    ports:
      - "5432:5432"

    volumes:
      - kotonoha_pg_data:/var/lib/postgresql/data

volumes:
  kotonoha_pg_data:
